name: Gerar executável ClipForge

# Roda ao enviar um commit, ao criar uma tag v* ou manualmente (aba Actions → Run workflow).
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Windows usa cp1252 no stdout; sem isto os prints com "✓" quebram o fetch_ffmpeg.py.
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: ClipForge-Windows
            path: dist/ClipForge.exe
          - os: macos-latest
            label: macOS
            artifact: ClipForge-macOS
            path: dist/ClipForge
          - os: ubuntu-latest
            label: Linux
            artifact: ClipForge-Linux
            path: dist/ClipForge

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller imageio-ffmpeg
          pip install pywebview

      - name: Baixar ffmpeg (embutido no app)
        run: python packaging/fetch_ffmpeg.py

      - name: Empacotar (arquivo único)
        env:
          CLIPFORGE_ONEFILE: "1"
        run: pyinstaller --noconfirm --clean packaging/clipforge.spec

      - name: Publicar o executável
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  # Quando você cria uma tag (ex.: v0.1.0), anexa os 3 executáveis a uma Release para download direto.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Criar Release com os executáveis
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
